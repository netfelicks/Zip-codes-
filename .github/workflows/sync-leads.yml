name: Sync Fresno new-business leads

on:
  workflow_dispatch:
  schedule:
    # 8:15 AM Pacific Standard Time; GitHub Actions schedules use UTC.
    - cron: '15 16 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run sync-leads
      - name: Commit updated leads when the source changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.json
          git diff --cached --quiet || git commit -m "Update Fresno new-business leads"
          git push
